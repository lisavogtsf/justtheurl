<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>justtheurl</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module">
    import { initApp } from './js/app.js';
    initApp(document);
  </script>
</head>
<body>
  <h1>
    <span class="title__word--secondary">just</span><span class="title__word--tertiary">the</span><span class="title__word--primary">url</span>
  </h1>
  <button id="theme-toggle" aria-label="Toggle theme">
    <svg class="icon-moon" hidden width="20" height="20">
      <use href="icons/icons.svg#icon-moon"/>
    </svg>
    <svg class="icon-sun" width="20" height="20">
      <use href="icons/icons.svg#icon-sun"/>
    </svg>
  </button>
  <main>
    <label for="url-input" class="sr-only">URL to strip</label>
    <div class="input-row">
      <input type="url" id="url-input" class="url-input" placeholder="Paste a URL…" autofocus>
      <button id="paste" aria-label="Paste from clipboard" title="Paste from clipboard">
        <svg width="16" height="16"><use href="icons/icons.svg#icon-paste"/></svg>
      </button>
      <button id="clear" aria-label="Clear input" title="Clear input">
        <svg width="16" height="16"><use href="icons/icons.svg#icon-clear"/></svg>
      </button>
    </div>
    <output class="url-output" aria-live="polite" role="status" aria-atomic="true"></output>
    <div class="action-row">
      <button id="copy" class="copy-btn" title="Copy">
        <svg width="16" height="16"><use href="icons/icons.svg#icon-copy"/></svg>
        <span class="copy-label">Copy</span>
      </button>
      <button id="open" class="open-btn" title="Open">
        <svg width="16" height="16"><use href="icons/icons.svg#icon-open"/></svg>
        Open
      </button>
    </div>
  </main>
</body>
</html>
