<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>justtheurl</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f5f3;
    --text: #1a1a18;
    --text-secondary: #6b6b67;
    --text-tertiary: #9e9e9a;
    --border: rgba(0,0,0,0.12);
    --border-hover: rgba(0,0,0,0.25);
    --green: #1d9e75;
    --red: #d85a30;
    --warn: #b06a10;
    --radius: 10px;
    --radius-sm: 7px;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Code', 'Fira Code', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg-secondary: #252523;
      --text: #f0ede8;
      --text-secondary: #a0a09c;
      --text-tertiary: #6b6b67;
      --border: rgba(255,255,255,0.1);
      --border-hover: rgba(255,255,255,0.22);
      --green: #5dcaa5;
      --red: #f0997b;
      --warn: #e8a945;
    }
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }

  .card {
    width: 100%;
    max-width: 560px;
  }

  .brand {
    margin-bottom: 2.25rem;
  }

  .brand-name {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .brand-name span {
    color: var(--text-tertiary);
  }

  .brand-tag {
    font-size: 13px;
    color: var(--text-tertiary);
    margin-top: 4px;
  }

  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1rem;
  }

  /* Wrapper gives us the relative context for the inline × button */
  .input-wrapper {
    flex: 1;
    position: relative;
    display: flex;
  }

  input[type="text"] {
    flex: 1;
    height: 40px;
    padding: 0 30px 0 12px; /* right padding leaves room for × */
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
    width: 100%;
  }

  input[type="text"]::placeholder { color: var(--text-tertiary); }
  input[type="text"]:focus { border-color: var(--border-hover); }
  input[type="text"].input-warn { border-color: var(--warn); }

  /* Inline × clear button inside the input */
  .clear-input-btn {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
    display: none; /* shown via JS when input has content */
    align-items: center;
    justify-content: center;
    width: 18px;
    height: 18px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--text-tertiary);
    font-size: 15px;
    line-height: 1;
    padding: 0;
    border-radius: 3px;
    -webkit-appearance: none;
  }

  .clear-input-btn:hover { color: var(--text-secondary); }

  button.strip-btn {
    height: 40px;
    padding: 0 18px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, border-color 0.1s;
    -webkit-appearance: none;
  }

  button.strip-btn:hover { background: var(--bg-secondary); border-color: var(--border-hover); }
  button.strip-btn:active { transform: scale(0.98); }

  button.paste-btn {
    height: 40px;
    padding: 0 18px;
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.1s, border-color 0.1s;
    -webkit-appearance: none;
  }

  button.paste-btn:hover { background: var(--bg-secondary); border-color: var(--border-hover); }
  button.paste-btn:active { transform: scale(0.98); }

  .result-box {
    background: var(--bg-secondary);
    border: 0.5px solid var(--border);
    border-radius: var(--radius);
    padding: 1rem 1.25rem;
    min-height: 68px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: background 0.1s;
  }

  /* Clickable-to-copy when a result is present */
  .result-box.has-result { cursor: pointer; }
  .result-box.has-result:hover { background: var(--bg-secondary); }

  .result-empty {
    font-size: 14px;
    color: var(--text-tertiary);
    flex: 1;
  }

  .result-url {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text);
    word-break: break-all;
    flex: 1;
    line-height: 1.5;
    display: none;
    text-decoration: none;
  }

  a.result-url:hover { text-decoration: underline; text-underline-offset: 3px; }

  button.copy-btn {
    flex-shrink: 0;
    display: none;
    align-items: center;
    gap: 5px;
    height: 32px;
    padding: 0 12px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text);
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.1s;
    -webkit-appearance: none;
  }

  button.copy-btn:hover { background: var(--bg); }
  button.copy-btn.copied { color: var(--green); border-color: var(--green); }

  a.open-btn {
    flex-shrink: 0;
    display: none;
    align-items: center;
    gap: 4px;
    height: 32px;
    padding: 0 12px;
    font-family: var(--sans);
    font-size: 13px;
    color: var(--text);
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: var(--radius-sm);
    cursor: pointer;
    text-decoration: none;
    transition: background 0.1s;
    -webkit-appearance: none;
  }

  a.open-btn:hover { background: var(--bg); }

  .copy-icon { width: 15px; height: 15px; }

  .meta {
    display: none;
    align-items: center;
    gap: 12px;
    margin-top: 0.6rem;
    font-size: 12px;
    color: var(--text-tertiary);
  }

  .meta-removed { color: var(--red); }
  .meta-warn { color: var(--warn); }

  .clear-btn {
    margin-left: auto;
    background: none;
    border: none;
    cursor: pointer;
    font-size: 12px;
    font-family: var(--sans);
    color: var(--text-tertiary);
    padding: 0;
    -webkit-appearance: none;
  }

  .clear-btn:hover { color: var(--text-secondary); }

  .footer {
    margin-top: 2.5rem;
    font-size: 12px;
    color: var(--text-tertiary);
    text-align: center;
  }
</style>
</head>
<body>
<main class="card">

  <div class="brand">
    <div class="brand-name">just<span>the</span>url</div>
    <div class="brand-tag">strip everything after the ?</div>
  </div>

  <div class="input-row">
    <div class="input-wrapper">
      <input type="text" id="urlInput" placeholder="Paste a URL here…" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="url" autofocus />
      <button class="clear-input-btn" id="clearInputBtn" onclick="clearAll()" aria-label="Clear input">✕</button>
    </div>
    <button class="paste-btn" id="pasteBtn" onclick="pasteFromClipboard()" aria-label="Paste from clipboard">Paste</button>
    <button class="strip-btn" onclick="strip()">Strip it</button>
  </div>

  <!-- aria-live announces result changes to screen readers; role="status" is polite -->
  <div class="result-box" id="resultBox" role="status" aria-live="polite" aria-atomic="true">
    <span class="result-empty" id="emptyMsg">Your clean URL will appear here</span>
    <a class="result-url" id="resultUrl" target="_blank" rel="noopener noreferrer"></a>
    <a class="open-btn" id="openBtn" target="_blank" rel="noopener noreferrer" aria-label="Open clean URL in new tab">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
      Open
    </a>
    <button class="copy-btn" id="copyBtn" onclick="copyUrl()" aria-label="Copy clean URL">
      <svg class="copy-icon" id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      <span id="copyLabel">Copy</span>
    </button>
  </div>

  <div class="meta" id="metaRow">
    <span id="metaKept"></span>
    <span class="meta-removed" id="metaRemoved"></span>
    <button class="clear-btn" onclick="clearAll()">clear</button>
  </div>

  <p class="footer">runs locally &mdash; nothing is sent anywhere</p>

</main>

<script>
  const urlInput      = document.getElementById('urlInput');
  const clearInputBtn = document.getElementById('clearInputBtn');
  const emptyMsg      = document.getElementById('emptyMsg');
  const resultBox     = document.getElementById('resultBox');
  const resultUrl     = document.getElementById('resultUrl');
  const openBtn       = document.getElementById('openBtn');
  const copyBtn       = document.getElementById('copyBtn');
  const copyLabel     = document.getElementById('copyLabel');
  const copyIcon      = document.getElementById('copyIcon');
  const metaRow       = document.getElementById('metaRow');
  const metaKept      = document.getElementById('metaKept');
  const metaRemoved   = document.getElementById('metaRemoved');

  let cleanUrl = '';

  // Returns true if the string plausibly looks like a URL
  function looksLikeUrl(s) {
    return /[./:?#]/.test(s);
  }

  urlInput.addEventListener('input', () => {
    const hasValue = urlInput.value.trim().length > 0;
    clearInputBtn.style.display = hasValue ? 'flex' : 'none';
    hasValue ? strip() : clearAll();
  });

  urlInput.addEventListener('keydown', e => {
    if (e.key === 'Enter') strip();
    if (e.key === 'Escape') clearAll(); // 9: Escape clears
  });

  // 5: clicking the result box copies the URL (unless clicking the Open link or result URL link)
  resultBox.addEventListener('click', e => {
    if (!cleanUrl) return;
    if (openBtn.contains(e.target)) return;   // let Open navigate
    if (resultUrl.contains(e.target)) return; // let link navigate
    copyUrl();
  });

  function strip() {
    const raw = urlInput.value.trim();
    if (!raw) return;

    // 7: warn if input doesn't look like a URL at all
    const urlLike = looksLikeUrl(raw);
    urlInput.classList.toggle('input-warn', !urlLike);

    const qIdx    = raw.indexOf('?');
    const hashIdx = raw.indexOf('#');
    let base, params = '', fragment = '';

    if (qIdx !== -1) {
      base = raw.slice(0, qIdx);
      const rest = raw.slice(qIdx + 1);
      const hIdx = rest.indexOf('#');
      if (hIdx !== -1) { params = rest.slice(0, hIdx); fragment = rest.slice(hIdx); }
      else { params = rest; }
    } else if (hashIdx !== -1) {
      base = raw.slice(0, hashIdx);
      fragment = raw.slice(hashIdx);
    } else {
      base = raw;
    }

    // 10: trim trailing slash when it's just scheme://domain/  (no real path)
    base = base.replace(/^(https?:\/\/[^/?#]+)\/$/, '$1');

    cleanUrl = base + fragment;
    const paramCount = params ? params.split('&').filter(Boolean).length : 0;
    showResult(cleanUrl, paramCount, urlLike);
  }

  function showResult(url, removed, urlLike) {
    const isAbsolute = /^https?:\/\//i.test(url);
    emptyMsg.style.display   = 'none';
    resultUrl.style.display  = 'block';
    resultUrl.textContent    = url;
    resultUrl.href           = isAbsolute ? url : null;
    resultUrl.style.pointerEvents = isAbsolute ? '' : 'none';
    openBtn.href             = url;
    openBtn.style.display    = isAbsolute ? 'flex' : 'none';
    copyBtn.style.display    = 'flex';
    copyBtn.classList.remove('copied');
    copyLabel.textContent    = 'Copy';
    copyIcon.innerHTML       = '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
    resultBox.classList.add('has-result');
    resultBox.title          = 'Click to copy';
    metaRow.style.display    = 'flex';

    if (!urlLike) {
      metaKept.textContent      = 'doesn\'t look like a URL';
      metaKept.className        = 'meta-warn';
      metaRemoved.style.display = 'none';
    } else if (removed > 0) {
      metaKept.textContent      = 'clean URL kept';
      metaKept.className        = '';
      metaRemoved.textContent   = removed + ' param' + (removed !== 1 ? 's' : '') + ' removed';
      metaRemoved.style.display = '';
    } else {
      metaKept.textContent      = 'no params found — URL is already clean';
      metaKept.className        = '';
      metaRemoved.style.display = 'none';
    }
  }

  function copyUrl() {
    if (!cleanUrl) return;
    navigator.clipboard.writeText(cleanUrl).then(() => {
      copyBtn.classList.add('copied');
      copyLabel.textContent = 'Copied';
      copyIcon.innerHTML = '<polyline points="20 6 9 17 4 12"/>';
      setTimeout(() => {
        copyBtn.classList.remove('copied');
        copyLabel.textContent = 'Copy';
        copyIcon.innerHTML = '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>';
      }, 2000);
    });
  }

  async function pasteFromClipboard() {
    try {
      const text = await navigator.clipboard.readText();
      if (text.trim()) {
        urlInput.value = text.trim();
        clearInputBtn.style.display = 'flex';
        strip();
      }
    } catch (err) {
      // Permission denied or API unavailable — focus input so user can paste manually
      urlInput.focus();
      urlInput.select();
    }
  }

  // Hide Paste button if clipboard read API is unavailable (e.g. non-secure context)
  if (!navigator.clipboard || typeof navigator.clipboard.readText !== 'function') {
    document.getElementById('pasteBtn').style.display = 'none';
  }

  function clearAll() {
    urlInput.value              = '';
    urlInput.classList.remove('input-warn');
    clearInputBtn.style.display = 'none';
    cleanUrl                    = '';
    emptyMsg.style.display      = 'block';
    resultUrl.style.display     = 'none';
    openBtn.style.display       = 'none';
    copyBtn.style.display       = 'none';
    resultBox.classList.remove('has-result');
    resultBox.title             = '';
    metaRow.style.display       = 'none';
    urlInput.focus();
  }
</script>
</body>
</html>
